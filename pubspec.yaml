name: dorama_nest
description: DoramaNest — a cozy Korean & Chinese drama discovery and reviews Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  http: ^1.6.0
  supabase_flutter: ^2.18.2
  connectivity_plus: ^6.1.4
  cached_network_image: ^4.0.4
  sqflite: ^2.4.1
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/art/seoul_evening.jpg
    - assets/art/community_evening.jpg
